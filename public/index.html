<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auditoría del camino del lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F4F7; --panel:#FFFFFF; --ink:#1C2230; --muted:#667085; --line:#E3E6EC; --chip:#EEF0F4;
  --c-sin:#6B7280; --c-rev:#4B5563; --c-tri:#6366F1; --c-pn:#DC2626; --c-pi:#9D174D; --c-ca:#78716C; --c-form:#B45309; --c-de:#475569; --c-abi:#E5940B; --c-con:#16A34A; --c-lla:#9B4DEB; --c-per:#D93636;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181B22; --panel:#21252E; --ink:#E9ECF2; --muted:#9AA3B2; --line:#323846; --chip:#2B303B;
    --c-sin:#9CA3AF; --c-rev:#8A93A3; --c-tri:#8B8DF7; --c-pn:#F05252; --c-pi:#E0628E; --c-ca:#A8A29E; --c-form:#F59E0B; --c-de:#94A3B8; --c-abi:#F5A524; --c-con:#2FBF62; --c-lla:#B57BF5; --c-per:#F05252;
  }
}
:root[data-theme="dark"]{
  --bg:#181B22; --panel:#21252E; --ink:#E9ECF2; --muted:#9AA3B2; --line:#323846; --chip:#2B303B;
  --c-sin:#9CA3AF; --c-rev:#8A93A3; --c-tri:#8B8DF7; --c-pn:#F05252; --c-pi:#E0628E; --c-ca:#A8A29E; --c-form:#F59E0B; --c-de:#94A3B8; --c-abi:#F5A524; --c-con:#2FBF62; --c-lla:#B57BF5; --c-per:#F05252;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-size:clamp(26px,3.4vw,38px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0}
.snap{color:var(--muted);font-size:13.5px}
.num{font-variant-numeric:tabular-nums}

/* Resumen */
.summary{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.total{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.total b{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.total span{color:var(--muted)}
.bar{display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--chip)}
.bar button{border:0;padding:0;cursor:pointer;color:#fff;font:700 13px/1 inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;min-width:0;transition:filter .15s}
.bar button:hover{filter:brightness(1.08)}
.bar button:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 18px;margin-top:14px}
.leg{display:flex;align-items:center;gap:9px;padding:6px 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:6px}
.leg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dot{width:11px;height:11px;border-radius:3px;flex:none}
.leg .n{font-weight:700;font-size:20px;min-width:2ch}
.leg .l{color:var(--muted);font-size:13.5px;line-height:1.2}
.leg.off{opacity:.38}
.sub{font-weight:700;font-size:14.5px;margin:22px 0 10px}
.summary .sub0{font-weight:700;font-size:14.5px;margin:0 0 10px}

.days{margin-top:18px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:13px}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:18px 0 14px}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group > span{color:var(--muted);font-size:13px;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13.5px/1 inherit;font-family:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--c-abi);outline-offset:2px}
input[type=search]{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 12px;font:inherit;font-size:14px;min-width:220px;flex:1;max-width:320px}
input[type=search]:focus-visible{outline:2px solid var(--c-abi);outline-offset:1px}
.spacer{flex:1}

/* Tablero */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--chip);border-radius:12px;padding:10px;min-height:120px;max-height:min(78vh,820px);overflow-y:auto;overscroll-behavior:contain;padding-top:0}
.col h2{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;margin:2px 4px 10px;position:sticky;top:0;z-index:1;background:var(--chip);margin:0 -10px 10px;padding:12px 14px 6px}
.col h2 .count{margin-left:auto;font-weight:700;color:var(--muted)}
.col h2 .dot{width:10px;height:10px}
.col .stages{color:var(--muted);font-size:12.5px;margin:-6px 4px 10px;line-height:1.3}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cat);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.card .nm{font-weight:650;font-size:14.5px;line-height:1.25;word-break:break-word}
.card .em{color:var(--muted);font-size:12.5px;word-break:break-all;margin-top:2px}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.tag{font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--chip);color:var(--ink);line-height:1.2}
.tag.st{color:#fff}
.when{font-size:12px;color:var(--muted);margin-left:auto}
.empty{color:var(--muted);font-size:13px;padding:10px 4px}

/* Lista */
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.list table{min-width:640px}
.list td,.list th{text-align:left}
.list td .tag.st{display:inline-block}
.hidden{display:none!important}
.nav{display:inline-block;margin-top:6px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--c-abi)}
.nav:hover{color:var(--c-abi)}
.period{font-size:clamp(17px,2vw,22px);font-weight:600;color:var(--muted);margin-top:6px}
footer{color:var(--muted);font-size:12.5px;margin-top:22px;max-width:76ch}
@media (max-width:700px){.wrap{padding:18px 12px 36px}.total b{font-size:36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 18px}
.range input[type=date]{border:1px solid
